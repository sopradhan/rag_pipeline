[loggers]
keys=root,api,data,ai,orchestration

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_api]
level=INFO
handlers=fileHandler
qualname=api
propagate=0

[logger_data]
level=INFO
handlers=fileHandler
qualname=data
propagate=0

[logger_ai]
level=INFO
handlers=fileHandler
qualname=ai
propagate=0

[logger_orchestration]
level=INFO
handlers=fileHandler
qualname=orchestration
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=defaultFormatter
args=('logs/incident_management.log', 'a', 10485760, 5)

[formatter_defaultFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S