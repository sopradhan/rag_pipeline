[tool.poetry]
name = "rag_pipeline"
version = "0.1.0"
description = "Comprehensive RAG pipeline with multi-source support, classification, and security"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
langchain = ">=0.0.300"
pydantic = ">=2.4"
python-dotenv = ">=1.0"
sqlalchemy = ">=2.0"
pandas = ">=2.1"
numpy = ">=1.24"
python-magic = ">=0.4"
python-docx = ">=0.8"
PyPDF2 = ">=3.0"
beautifulsoup4 = ">=4.12"
markdown = ">=3.4"
PyYAML = ">=6.0"
openpyxl = ">=3.1"
lxml = ">=4.9"
chromadb = ">=0.4"
sentence-transformers = ">=2.2"
torch = ">=2.0"
transformers = ">=4.33"
scikit-learn = ">=1.3"
umap-learn = ">=0.5"
hdbscan = ">=0.8"
fastapi = ">=0.103"
uvicorn = ">=0.23"
streamlit = ">=1.26"
requests = ">=2.31"
plotly = ">=5.16"
matplotlib = ">=3.7"
python-jose = ">=3.3"
passlib = ">=1.7"
regex = ">=2023.8"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-asyncio = ">=0.21"
httpx = ">=0.24"
black = ">=23.7"
isort = ">=5.12"
mypy = ">=1.5"
pylint = ">=2.17"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pylint.messages_control]
disable = ["C0111"]